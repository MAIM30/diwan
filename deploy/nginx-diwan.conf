server {
    listen 80;
    server_name _;

    root /var/www/diwan;
    index public/index.php;

    charset utf-8;
    client_max_body_size 10M;

    # Blokir akses ke folder internal
    location ~ ^/(app|config|database|storage|deploy|wa-gateway|tests)(/|$) {
        return 403;
    }

    # Blokir file sensitif
    location ~ \.(md|sql|log|env)$ {
        return 403;
    }

    # Blokir dotfiles (kecuali .well-known)
    location ~ /\.(?!well-known) {
        return 403;
    }

    # Aset statis di public/
    location ~ ^/(assets|uploads|favicon\.ico) {
        try_files /public/$uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Front controller PHP
    location ~ ^/public/index\.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Tolak akses langsung ke semua file .php lain
    location ~ \.php$ {
        return 403;
    }

    # Semua rute lain → front controller
    location / {
        try_files $uri $uri/ /public/index.php?url=$uri&$args;
    }
}
